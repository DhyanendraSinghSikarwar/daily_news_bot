name: Daily AI News Digest

on:
  schedule:
    # ─── SCHEDULE (the time is in UTC, not your local time) ───────────────
    # Cron fields: minute hour day-of-month month day-of-week
    #   "30 2 * * *"  = 02:30 UTC every day = 08:00 IST (India, UTC+5:30)
    # To change it, convert your local time to UTC and edit the line below, e.g.
    #   "0 13 * * *"  = 13:00 UTC = 09:00 New York (EDT) / 14:00 London (BST)
    #   "0 7 * * 1-5" = 07:00 UTC, Monday to Friday only
    # Helper: https://crontab.guru. GitHub may start scheduled runs 5–30 min late.
    - cron: "30 2 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab for manual tests

permissions:
  contents: write # needed to commit last_run.txt (keep-alive)

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and send digest
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LOOKBACK_HOURS: ${{ secrets.LOOKBACK_HOURS }} # optional, default 24
          MAX_PER_SOURCE: ${{ secrets.MAX_PER_SOURCE }} # optional, default 5
        run: python news_bot.py

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Committing a timestamp every run keeps the schedule alive.
      # "if: always()" makes this run even if a delivery step failed.
      - name: Keep-alive commit
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "chore: keep-alive $(cat last_run.txt) [skip ci]" || exit 0
          git pull --rebase --quiet
          git push
